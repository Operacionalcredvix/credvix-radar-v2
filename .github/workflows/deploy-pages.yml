name: Deploy Credvix Radar to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test deployed version detection
        run: node scripts/test-deployment-version.mjs

      - name: Build
        run: npm run build

      - name: Verify build manifest
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const version = JSON.parse(fs.readFileSync("dist/version.json", "utf8"));
            const expected = process.env.GITHUB_SHA + "-" + process.env.GITHUB_RUN_ID + "-" + (process.env.GITHUB_RUN_ATTEMPT || "1");
            if (version.buildId !== expected) throw new Error("Manifest is not from this build");
            console.log("Published build ID: " + version.buildId);
          '

      - name: Verify ranking layouts and published-version refresh
        run: node scripts/verify-layout.mjs

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-viewport-checks
          path: layout-screenshots/*.png
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
